[package]
name = "kairo"
version = "1.0.0"
description = "KAIRO — Local Runtime Manager for Windows"
authors = ["KAIRO Team"]
edition = "2021"
default-run = "kairo"

[lib]
name = "kairo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
